services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    expose:
      - "8080"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["sw-worker"]
    env_file: .env
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
